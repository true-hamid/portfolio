name: Deploy to hosting server

# Production ships only from a merged pull request. Direct pushes to main no
# longer trigger this workflow at all, so a hotfix committed straight to the
# branch cannot reach the host without review.
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, and never cancel one midway: a half-finished FTP
# upload leaves the host serving a mix of old and new assets. Rollbacks share
# this same group, so a rollback and a forward deploy can never race either.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # `closed` fires for abandoned pull requests too — only merges deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/deploy-core.yml
    with:
      ref: main
    secrets: inherit
